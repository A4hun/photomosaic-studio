[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photomosaic-studio"
version = "1.0.0rc1"
description = "照片马赛克工作室：把任意照片变成用你自己的照片库拼成的巨型马赛克拼图（自适应四叉树 / 智能分配 / GPU 加速 / 超大流式 BigTIFF 输出）"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "PhotoMosaic Studio Contributors"}]
keywords = ["photo-mosaic", "mosaic", "collage", "photography", "bigtiff", "quadtree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=7", "tifffile"]

[project.scripts]
photomosaic = "photomosaic.cli:main"

[project.urls]
Homepage = "https://github.com/A4hun/photomosaic-studio"
Issues = "https://github.com/A4hun/photomosaic-studio/issues"
Changelog = "https://github.com/A4hun/photomosaic-studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["photomosaic*"]
